<!-- catalog/templates/catalog/menu.html -->
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <!-- Логотип -->
    <h5 class="my-0 font-weight-normal">
        <a href="/" class="text-dark text-decoration-none">MyStore</a>
    </h5>

    <nav class="ms-4">
        <a class="p-2 text-dark text-decoration-none" href="{% url 'catalog:product_list' %}">Каталог</a>
        <a class="p-2 text-dark text-decoration-none" href="{% url 'catalog:contacts' %}">Контакты</a>
    </nav>
    <nav class="ms-auto d-flex align-items-center">
        {% if user.is_authenticated %}
        <span class="text-muted me-3 small">{{ user.email }}</span>
        <form action="{% url 'users:logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-danger">Выйти</button>
        </form>
        {% else %}
        <a class="btn btn-sm btn-outline-primary me-2" href="{% url 'users:login' %}">Войти</a>
        <a class="btn btn-sm btn-primary" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>
